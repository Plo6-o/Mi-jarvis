<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Jarvis · AI 工作台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#0a0a0a;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{padding:10px 14px;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;flex-shrink:0}
.topbar h1{margin:0;font-size:16px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#4f4}
.dot.locked{background:#f44}
.tabs{display:flex;background:#0f0f0f;border-bottom:1px solid #1c1c1c;flex-shrink:0}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#6cf;border-bottom-color:#6cf}
.main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.page{display:none}
.page.active{display:block}
.msg{margin-bottom:14px;display:flex;gap:8px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.msg.user .avatar{background:#2a2a2a}
.msg.assistant .avatar{background:linear-gradient(135deg,#6cf,#c6f);color:#000}
.msg.team .avatar{background:#2a2a4a;color:#c6f}
.bubble{max-width:calc(100% - 44px);padding:10px 12px;border-radius:12px;word-wrap:break-word;white-space:pre-wrap;font-size:14px}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:#1f3a5f}
.msg.assistant .bubble{background:#161616;border:1px solid #222}
.msg.team .bubble{background:#1a1a2a;border:1px solid #333}
.bubble pre{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:8px;overflow-x:auto;font-size:12px;margin:8px 0}
.bubble code{background:#222;padding:1px 4px;border-radius:3px;font-size:12px}
.role{font-size:11px;color:#6cf;margin-bottom:4px;font-weight:600}
.input-area{border-top:1px solid #1c1c1c;padding:10px;background:#0a0a0a;flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:40px;max-height:100px;background:#161616;border:1px solid #262626;color:#e6e6e6;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;outline:none}
textarea:focus{border-color:#6cf}
.send-btn{background:#6cf;color:#000;border:none;width:40px;height:40px;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;flex-shrink:0}
.send-btn:disabled{background:#333;color:#666}
.chips{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;padding-bottom:4px}
.chip{background:#1a1a1a;border:1px solid #262626;color:#aaa;padding:4px 10px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.card{background:#161616;border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px}
.card .meta{font-size:12px;color:#888;margin-top:6px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;background:#222;color:#6cf}
.btn-row{display:flex;gap:6px;margin-top:10px}
.btn-row button{flex:1;background:#1a1a1a;border:1px solid #262626;color:#ccc;padding:6px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-row button.primary{background:#6cf;color:#000;border-color:#6cf}
label{display:block;margin:14px 0 6px;color:#aaa;font-size:13px}
input,select{width:100%;background:#161616;border:1px solid #262626;color:#e6e6e6;padding:10px;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.btn{background:#6cf;color:#000;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;font-size:15px;margin-top:14px}
.btn.secondary{background:#1a1a1a;color:#ccc;border:1px solid #262626}
.help{color:#666;font-size:11px;margin-top:4px}
.status{text-align:center;font-size:12px;color:#888;padding:4px;flex-shrink:0;min-height:20px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6cf;margin:0 1px;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
.lock{position:fixed;inset:0;background:#0a0a0a;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lock h1{margin-bottom:6px}
.lock .sub{color:#888;font-size:13px;margin-bottom:24px}
.lock input{text-align:center;font-size:18px;letter-spacing:2px;max-width:240px}
.lock .err{color:#f44;font-size:13px;margin-top:10px;min-height:18px}
.prio-P0{color:#f44;font-weight:600}
.prio-P1{color:#fa0;font-weight:600}
.prio-P2{color:#6cf}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div style="font-size:50px;margin-bottom:8px">🔐</div>
  <h1>Jarvis</h1>
  <div class="sub" id="lockSub">输入解锁密码</div>
  <input type="password" id="pwd" placeholder="••••••">
  <div class="err" id="lockErr"></div>
  <button class="btn" style="max-width:240px;margin-top:14px" onclick="unlock()">解锁</button>
  <div class="help" style="margin-top:20px;max-width:280px;text-align:center">首次使用会引导设置密码,所有 API Key 加密存云端,只有你能解。</div>
</div>

<div class="topbar">
  <h1><div class="dot locked" id="dot"></div>Jarvis</h1>
  <div style="display:flex;gap:6px">
    <button class="chip" onclick="showPage('settings')">⚙ 设置</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-p="chat" onclick="showPage('chat')">💬 对话</div>
  <div class="tab" data-p="team" onclick="showPage('team')">🤝 团队</div>
  <div class="tab" data-p="proj" onclick="showPage('proj')">📂 项目</div>
  <div class="tab" data-p="prompt" onclick="showPage('prompt')">✨ 提示词</div>
</div>

<div class="main">
  <div class="page active" id="page-chat"><div id="chat"></div></div>

  <div class="page" id="page-team">
    <h2 style="margin-top:0">🤝 团队讨论</h2>
    <div class="help">Jarvis 召集策划(GLM)+ 执行(通义)+ 审核(DeepSeek)开会</div>
    <label>讨论主题</label>
    <textarea id="topic" rows="3" placeholder="例:小红书母婴账号内容方向"></textarea>
    <button class="btn" onclick="startTeam()">启动讨论会</button>
    <div id="teamResult" style="margin-top:16px"></div>
  </div>

  <div class="page" id="page-proj">
    <h2 style="margin-top:0">📂 项目</h2>
    <button class="btn secondary" onclick="newProj()">+ 新建项目</button>
    <div id="projList" style="margin-top:14px"></div>
    <h2 style="margin-top:24px">📋 任务</h2>
    <button class="btn secondary" onclick="newTask()">+ 新建任务</button>
    <div id="taskList" style="margin-top:14px"></div>
  </div>

  <div class="page" id="page-prompt">
    <h2 style="margin-top:0">✨ 提示词工坊</h2>
    <label>你的原始想法</label>
    <textarea id="pRaw" rows="3" placeholder="例:让 AI 帮我写小红书爆款文"></textarea>
    <label>使用场景</label>
    <input id="pGoal" placeholder="例:每天生成 5 篇">
    <button class="btn" onclick="optimizePrompt()">生成 3 个版本</button>
    <div id="pResult" style="margin-top:16px"></div>
  </div>

  <div class="page" id="page-settings">
    <h2 style="margin-top:0">⚙ 设置</h2>
    <div class="help">所有 Key 用密码加密存云端。修改后需重新解锁。</div>
    <label>DeepSeek(主调度,推荐填)</label>
    <input type="password" id="k-deepseek" placeholder="sk-...">
    <label>智谱 GLM(策划)</label>
    <input type="password" id="k-glm" placeholder="...">
    <label>Kimi(长文)</label>
    <input type="password" id="k-kimi" placeholder="sk-...">
    <label>通义千问(代码/文案)</label>
    <input type="password" id="k-qwen" placeholder="sk-...">
    <label>OpenAI(备用)</label>
    <input type="password" id="k-openai" placeholder="sk-...">
    <button class="btn" onclick="saveKeys()">💾 加密保存</button>
    <button class="btn secondary" onclick="lock()">🔒 加锁</button>
  </div>
</div>

<div class="input-area" id="inputArea" style="display:none">
  <div class="chips">
    <div class="chip" onclick="quick('今天最重要的 3 件事')">📅 今日重点</div>
    <div class="chip" onclick="quick('给我做个本周计划')">📋 周计划</div>
    <div class="chip" onclick="showPage('team')">🤝 开会</div>
  </div>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="跟 Jarvis 说点什么…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
  </div>
</div>

<div class="status" id="status"></div>

<script>
const API_BASE = 'https://jarvis-api.1349998010.workers.dev';
const TOKEN = 'jarvis-2026-134989';

let history = [];
let projects = [];
let tasks = [];
const $ = id => document.getElementById(id);

function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  $('page-' + p).classList.add('active');
  document.querySelector('.tab[data-p="' + p + '"]')?.classList.add('active');
  $('inputArea').style.display = p === 'chat' ? 'block' : 'none';
  if (p === 'proj') loadProj();
}

async function api(path, body) {
  const r = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '请求失败');
  return j;
}

async function apiGet(path) {
  const r = await fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  return r.json();
}

async function unlock() {
  const pwd = $('pwd').value;
  if (!pwd) return;
  $('lockErr').textContent = '...';
  try {
    const r = await api('/api/unlock', { password: pwd });
    localStorage.setItem('jarvis_pwd', pwd);
    $('lock').style.display = 'none';
    $('dot').classList.remove('locked');
    $('status').textContent = '✓ 已解锁,可用:' + r.providers.join(',');
    setTimeout(() => $('status').textContent = '', 2000);
  } catch (e) { $('lockErr').textContent = e.message; }
}

function lock() {
  localStorage.removeItem('jarvis_pwd');
  $('lock').style.display = 'flex';
  $('dot').classList.add('locked');
  $('pwd').value = '';
}

async function saveKeys() {
  const pwd = prompt('设个密码(至少 6 位)用来加密 Key:');
  if (!pwd || pwd.length < 6) return alert('密码太短');
  const keys = {};
  ['deepseek', 'glm', 'kimi', 'qwen', 'openai'].forEach(p => {
    const v = $('k-' + p).value.trim();
    if (v) keys[p] = v;
  });
  if (!Object.keys(keys).length) return alert('至少填一个');
  try {
    await api('/api/keys', { keys, password: pwd });
    await api('/api/unlock', { password: pwd });
    localStorage.setItem('jarvis_pwd', pwd);
    $('lock').style.display = 'none';
    $('dot').classList.remove('locked');
    alert('✓ 已加密保存并解锁');
  } catch (e) { alert(e.message); }
}

function quick(t) { $('input').value = t; send(); }

function addMsg(role, content, label) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  let html = '<div class="avatar">' + (role === 'user' ? '我' : (role === 'team' ? 'T' : 'J')) + '</div><div class="bubble">';
  if (label) html += '<div class="role">' + label + '</div>';
  html += format(content) + '</div>';
  d.innerHTML = html;
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function format(t) {
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  $('input').style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const ty = document.createElement('div');
  ty.className = 'msg assistant';
  ty.innerHTML = '<div class="avatar">J</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  $('chat').appendChild(ty);

  try {
    const r = await api('/api/chat', { messages: history, provider: 'deepseek', model: 'deepseek-chat' });
    ty.remove();
    addMsg('assistant', r.reply);
    history.push({ role: 'assistant', content: r.reply });
    if (history.length > 20) history = history.slice(-20);
  } catch (e) {
    ty.remove();
    addMsg('assistant', '❌ ' + e.message);
  }
}

async function startTeam() {
  const topic = $('topic').value.trim();
  if (!topic) return alert('写个讨论主题');
  $('teamResult').innerHTML = '<div class="typing"><span></span><span></span><span></span></div> 团队讨论中…';
  try {
    const r = await api('/api/team', { topic });
    let html = '';
    r.round1.forEach(x => {
      html += '<div class="msg team"><div class="avatar">T</div><div class="bubble"><div class="role">' + x.role + '</div>' + format(x.content) + '</div></div>';
    });
    html += '<div class="msg assistant"><div class="avatar">J</div><div class="bubble"><div class="role">📋 Jarvis 汇总</div>' + format(r.summary) + '</div></div>';
    $('teamResult').innerHTML = html;
  } catch (e) { $('teamResult').innerHTML = '❌ ' + e.message; }
}

async function loadProj() {
  try {
    const r = await apiGet('/api/project');
    projects = r.projects;
    $('projList').innerHTML = projects.length
      ? projects.map(p => '<div class="card"><h3>' + p.name + '</h3><div class="meta">' + (p.goal || '暂无目标') + '</div><div class="meta"><span class="badge">' + (p.status || 'active') + '</span></div></div>').join('')
      : '<div class="help">还没项目</div>';

    const r2 = await apiGet('/api/task');
    tasks = r2.tasks;
    $('taskList').innerHTML = tasks.length
      ? tasks.map(t => '<div class="card"><h3>' + t.title + ' <span class="prio-' + t.priority + '">' + t.priority + '</span></h3><div class="meta">' + (t.desc || '') + ' · 状态:' + t.status + '</div><div class="btn-row"><button onclick="updateTask(\'' + t.id + '\',\'doing\')">开始</button><button class="primary" onclick="updateTask(\'' + t.id + '\',\'done\')">完成</button></div></div>').join('')
      : '<div class="help">没任务</div>';
  } catch (e) { console.error(e); }
}

async function newProj() {
  const name = prompt('项目名?'); if (!name) return;
  const goal = prompt('项目目标?') || '';
  try { await api('/api/project', { name, goal, status: 'active' }); loadProj(); } catch (e) { alert(e.message); }
}

async function newTask() {
  const title = prompt('任务标题?'); if (!title) return;
  const desc = prompt('描述?') || '';
  const owner = prompt('负责人 AI (deepseek/glm/qwen/kimi)?', 'deepseek');
  const priority = prompt('优先级 (P0/P1/P2)?', 'P1');
  try { await api('/api/task', { title, desc, owner, priority, status: 'todo' }); loadProj(); } catch (e) { alert(e.message); }
}

async function updateTask(id, status) {
  try { await api('/api/task', { id, status }); loadProj(); } catch (e) { alert(e.message); }
}

async function optimizePrompt() {
  const raw = $('pRaw').value.trim();
  const goal = $('pGoal').value.trim();
  if (!raw) return alert('写点东西');
  $('pResult').innerHTML = '<div class="typing"><span></span><span></span><span></span></div> 优化中…';
  try {
    const r = await api('/api/prompt/optimize', { raw, goal });
    $('pResult').innerHTML = '<div class="card">' + format(r.prompts) + '</div>';
  } catch (e) { $('pResult').innerHTML = '❌ ' + e.message; }
}

$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

const savedPwd = localStorage.getItem('jarvis_pwd');
if (savedPwd) { $('pwd').value = savedPwd; unlock(); }
</script>
</body>
</html>
